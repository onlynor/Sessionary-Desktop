name: CI

# Every push and pull request: the Go code is formatted, vetted and tested on Linux, macOS and Windows; the desktop
# frontend type-checks against Sessionary's web client; the app is built and packaged for each platform, and the
# Linux packages are smoke-tested — the binary under Xvfb, and the .deb installed on a clean Ubuntu without Node.js.
#
# Sessionary Desktop builds Sessionary's server and web client from a checkout of Sessionary beside it
# (../Sessionary), so each job that builds checks both out side by side: desktop/ and Sessionary/.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      sessionary_ref:
        description: Sessionary branch, tag or commit to build against
        required: false
        default: main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  SESSIONARY_REPO: onlynor/Sessionary
  SESSIONARY_REF: ${{ github.event.inputs.sessionary_ref || 'main' }}
  BUN_VERSION: 1.3.14
  NODE_VERSION: 24.21.0

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Linux only: Windows checks out CRLF
      - name: Gofmt
        if: runner.os == 'Linux'
        run: |
          bad=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$bad" ]; then echo "not gofmt'd:"; echo "$bad"; exit 1; fi
      # MyGo needs no cgo: every platform's code vets from Linux
      - name: Vet (all platforms)
        if: runner.os == 'Linux'
        run: |
          go vet ./...
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...
      - name: Test
        if: runner.os != 'Windows'
        run: go test -count=1 ./...
      - name: Race (backend lifecycle, UI proxy)
        if: runner.os == 'Linux'
        run: go test -race -count=2 ./internal/...
      # the lifecycle tests drive real process groups and signals (Unix); compile the rest on Windows and run it
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test -count=1 ./...
      # the job object that keeps agents from outliving the app: real processes, only provable on Windows
      - name: Process lifecycle (Windows job object)
        if: runner.os == 'Windows'
        run: go test -count=1 -v -run 'Job|Stop|AppDeath|Adopt' ./internal/backend

  package:
    name: package (${{ matrix.platform }})
    needs: go
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
          - os: macos-latest
            platform: darwin/arm64
          - os: windows-latest
            platform: windows/amd64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
        with:
          path: desktop
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.SESSIONARY_REPO }}
          ref: ${{ env.SESSIONARY_REF }}
          path: Sessionary
          token: ${{ secrets.SESSIONARY_TOKEN || github.token }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum
      # Node.js runs the build tools (tsup, Vite); the app ships its own copy (scripts/build/fetch-node.mjs)
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install Sessionary's packages
        working-directory: Sessionary
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Install the desktop frontend's packages
        run: bun install --cwd frontend --frozen-lockfile
      # the typed bindings of the app's Go services (not committed)
      - name: Generate the bindings
        run: go tool mygo generate
      - name: Type-check
        run: bun run --cwd frontend typecheck
      # the agents' display order, and the overrides kept in step with the web client
      - name: Frontend tests
        run: bun run --cwd frontend test
      - name: Cache the Node.js runtime
        uses: actions/cache@v6
        with:
          path: ~/.cache/sessionary-desktop/node
          key: node-runtime-${{ matrix.platform }}-${{ hashFiles('desktop/scripts/build/fetch-node.mjs') }}
      - name: Build and package
        run: go tool mygo build
      - name: Smoke-test the binary
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libwebkit2gtk-4.1-0 xvfb xauth dbus
          scripts/test/smoke.sh build/linux-*/sessionary "$RUNNER_TEMP/smoke"
      - name: Smoke-test the .deb on a clean Ubuntu
        if: runner.os == 'Linux'
        run: scripts/test/smoke-deb.sh build/linux-*/sessionary_*.deb
      # macOS and Windows runners have a desktop session, so the packaged app is run once there. This has never
      # executed: it may not pass. It must not block the build, but its outcome is never implicit — the step after
      # it states passed / FAILED / not run in the job summary and as an annotation. Compiling and packaging for
      # these platforms is checked above; native runtime behaviour is claimed only when this says "passed".
      - name: Smoke-test the app (macOS)
        id: smoke_native
        if: runner.os == 'macOS'
        continue-on-error: true
        run: scripts/test/smoke-native.sh "$(find build -path '*.app/Contents/MacOS/*' -type f | head -1)" "$RUNNER_TEMP/smoke"
      - name: Smoke-test the app (Windows)
        id: smoke_native_win
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          find build -type f | head -30
          scripts/test/smoke-native.sh "$(find build -iname 'sessionary.exe' | head -1)" "$RUNNER_TEMP/smoke"
      - name: Report the native smoke outcome
        if: always() && runner.os != 'Linux'
        env:
          # each step's outcome is 'skipped' on the other OS, which is truthy: pick by OS
          OUTCOME: ${{ runner.os == 'macOS' && steps.smoke_native.outcome || steps.smoke_native_win.outcome }}
        run: |
          case "$OUTCOME" in
            success) msg="native smoke on ${{ runner.os }}: passed" ;;
            failure) msg="native smoke on ${{ runner.os }}: FAILED (not blocking; the packaged app did not run cleanly)" ;;
            *)       msg="native smoke on ${{ runner.os }}: NOT RUN ($OUTCOME) — runtime behaviour on this OS is unverified" ;;
          esac
          echo "$msg"
          echo "### $msg" >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != success ]; then echo "::warning title=Unverified on ${{ runner.os }}::$msg"; fi
      - name: Upload the smoke report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ strategy.job-index }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: sessionary-${{ strategy.job-index }}
          path: |
            desktop/build/*/*.deb
            desktop/build/*/*.tar.gz
            desktop/build/*/install.sh
            desktop/build/*/*.dmg
            desktop/build/*/*Setup*.exe
          if-no-files-found: warn
